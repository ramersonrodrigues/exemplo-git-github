<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- Configurações essenciais de viewport para responsividade perfeita no celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Miau & Ronrom - Portal Moderno de Gatinhos</title>

  <!-- Fontes personalizadas: Plus Jakarta Sans (corpo/títulos) e Material Symbols Outlined (ícones) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <!-- Folhas de estilo: Arquivo principal e folhas modulares de cada componente -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="styles/header.css" />
  <link rel="stylesheet" href="styles/hero.css" />
  <link rel="stylesheet" href="styles/categories.css" />
  <link rel="stylesheet" href="styles/buttons.css" />
  <link rel="stylesheet" href="styles/daily-tip.css" />
  <link rel="stylesheet" href="styles/facts.css" />
  <link rel="stylesheet" href="styles/adoption.css" />
  <link rel="stylesheet" href="styles/newsletter.css" />
  <link rel="stylesheet" href="styles/bottom-nav.css" />
</head>
<body>

  <!-- ===================================================================
       CARREGAMENTO DOS COMPONENTES HTML
       Todos os componentes são carregados dinamicamente via JavaScript
       =================================================================== -->

  <!-- Container para o componente de cabeçalho -->
  <div id="header-component"></div>

  <!-- ===================================================================
       CONTEÚDO PRINCIPAL DA PÁGINA (MAIN)
       =================================================================== -->
  <main class="site-main">

    <!-- Container para o componente Hero -->
    <div id="hero-component"></div>

    <!-- Container para o componente de categorias -->
    <div id="categories-component"></div>

    <!-- Container para o componente de dica do dia -->
    <div id="daily-tip-component"></div>

    <!-- Container para o componente de curiosidades -->
    <div id="facts-component"></div>

    <!-- Container para o componente de adoção -->
    <div id="adoption-component"></div>

    <!-- Container para o componente de newsletter -->
    <div id="newsletter-component"></div>

  </main>

  <!-- ===================================================================
       CONTAINER PARA A NAVEGAÇÃO INFERIOR
       =================================================================== -->
  <div id="bottom-nav-component"></div>

  <!-- ===================================================================
       SCRIPT DE INICIALIZAÇÃO DOS COMPONENTES
       =================================================================== -->
  <script type="module" src="script.js"></script>
</body>
</html>
