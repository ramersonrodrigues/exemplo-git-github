<!-- ===================================================================
     COMPONENTE: SEÇÃO HERO (DESTAQUE PRINCIPAL)
     Descrição: Apresentação visual do portal com imagem, título e botões de ação
     =================================================================== -->
<section class="hero-section" id="hero-section">
  <div class="hero-card">
    
    <!-- Imagem de destaque do gatinho e etiqueta temática -->
    <div class="hero-media">
      <img src="images/hero-cat.jpg" alt="Gatinho ruivo dormindo aconchegante" class="hero-image" />
      <div class="hero-overlay-gradient"></div>
      <div class="hero-badge">
        <span class="material-symbols-outlined badge-icon">pets</span>
        <span class="badge-text">Puro Aconchego</span>
      </div>
    </div>

    <!-- Conteúdo textual e botões de ação do Hero -->
    <div class="hero-content">
      <h2 class="hero-title">O universo do ronrom em suas mãos</h2>
      <p class="hero-description">
        Dicas práticas, guias de carinho, saúde preventiva e tudo para transformar a rotina do seu felino em pura harmonia.
      </p>
      
      <div class="hero-buttons">
        <!-- Botão primário principal -->
        <button class="btn btn-primary" id="btnHeroDiscover">
          <span>Descobrir Cuidados</span>
          <span class="material-symbols-outlined btn-icon">arrow_forward</span>
        </button>
        
        <!-- Botão secundário com efeito de áudio/relaxamento -->
        <button class="btn btn-round-secondary" id="btnPurrSound" aria-label="Ouvir ronrom relaxante" title="Ouvir som de ronrom">
          <span class="material-symbols-outlined text-filled">graphic_eq</span>
        </button>
      </div>
    </div>

  </div>
</section>
