<!-- ===================================================================
     COMPONENTE: CABEÇALHO SUPERIOR (HEADER)
     Descrição: Barra de navegação fixa no topo com logotipo, título e avatar
     =================================================================== -->
<header class="site-header">
  <div class="header-container">
    
    <!-- Lado esquerdo: Logotipo + Nome do Portal -->
    <div class="brand-wrapper">
      <div class="brand-logo-box">
        <img src="images/logo.jpg" alt="Logo Miau & Ronrom" class="brand-logo" />
      </div>
      <div class="brand-texts">
        <h1 class="brand-title">Miau &amp; Ronrom</h1>
        <span class="brand-subtitle">Portal Felino</span>
      </div>
    </div>

    <!-- Lado direito: Ícone de favoritos e avatar do usuário -->
    <div class="header-actions">
      <button class="icon-btn" aria-label="Ver favoritos" title="Meus Favoritos">
        <span class="material-symbols-outlined">favorite</span>
      </button>
      <div class="user-avatar" aria-label="Perfil do usuário">
        <span class="material-symbols-outlined">person</span>
      </div>
    </div>

  </div>
</header>
