<!-- ===================================================================
     COMPONENTE: CATEGORIAS / CHIPS HORIZONTAIS
     Descrição: Botões de filtro para explorar conteúdos por assunto
     =================================================================== -->
<section class="categories-section">
  <div class="section-header-row">
    <h3 class="section-title">Explorar por Assunto</h3>
    <span class="see-all-link" id="seeAllCategories">Ver todos</span>
  </div>

  <!-- Lista de chips horizontais interativos para filtrar conteúdos -->
  <div class="chips-container" id="categoryChips">
    <button class="chip active" data-category="all">
      <span class="material-symbols-outlined chip-icon">pets</span>
      <span>Todos</span>
    </button>
    <button class="chip" data-category="food-health">
      <span class="material-symbols-outlined chip-icon">restaurant</span>
      <span>Alimentação &amp; Saúde</span>
    </button>
    <button class="chip" data-category="behavior">
      <span class="material-symbols-outlined chip-icon">record_voice_over</span>
      <span>Comportamento &amp; Miados</span>
    </button>
    <button class="chip" data-category="play">
      <span class="material-symbols-outlined chip-icon">toys</span>
      <span>Brincadeiras &amp; Conforto</span>
    </button>
    <button class="chip" data-category="adoption">
      <span class="material-symbols-outlined chip-icon">favorite</span>
      <span>Adoção Responsável</span>
    </button>
  </div>
</section>
