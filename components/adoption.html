<!-- ===================================================================
     COMPONENTE: CORAÇÕES PARA ADOÇÃO
     Descrição: Grid de cards com gatinhos disponíveis para adoção
     =================================================================== -->
<section class="adoption-section" id="adoption-section">
  <div class="section-header-row">
    <div class="adoption-heading">
      <h3 class="section-title">Corações para Adoção</h3>
      <p class="section-subtitle">Prontos para encher um lar de afeto</p>
    </div>
    <a href="#" class="see-all-link with-icon" id="seeAllAdoption">
      <span>Ver todos</span>
      <span class="material-symbols-outlined">chevron_right</span>
    </a>
  </div>

  <!-- Grid responsivo com os cards de adoção -->
  <div class="adoption-grid">
    
    <!-- Card de Adoção: Gatinho Pipoca -->
    <article class="cat-card" data-cat-name="Pipoca">
      <div class="cat-card-media">
        <img src="images/cat-pipoca.jpg" alt="Gatinho tigrado amarelo Pipoca" class="cat-card-img" />
        
        <!-- Botão de curtir/favoritar individual -->
        <button class="fav-btn" aria-label="Favoritar Pipoca" title="Favoritar Pipoca">
          <span class="material-symbols-outlined">favorite</span>
        </button>
      </div>
      
      <div class="cat-card-body">
        <div class="cat-card-title-row">
          <h4 class="cat-name">Pipoca</h4>
          <span class="cat-age">4 meses</span>
        </div>
        <span class="cat-tag">Dócil &amp; brincalhão</span>
        <button class="btn-know-cat" data-cat="Pipoca">Conhecer</button>
      </div>
    </article>

    <!-- Card de Adoção: Gatinha Amora -->
    <article class="cat-card" data-cat-name="Amora">
      <div class="cat-card-media">
        <img src="images/cat-amora.jpg" alt="Gata tricolor Amora" class="cat-card-img" />
        
        <button class="fav-btn" aria-label="Favoritar Amora" title="Favoritar Amora">
          <span class="material-symbols-outlined">favorite</span>
        </button>
      </div>
      
      <div class="cat-card-body">
        <div class="cat-card-title-row">
          <h4 class="cat-name">Amora</h4>
          <span class="cat-age">1 ano</span>
        </div>
        <span class="cat-tag">Calma &amp; companheira</span>
        <button class="btn-know-cat" data-cat="Amora">Conhecer</button>
      </div>
    </article>

  </div>
</section>
